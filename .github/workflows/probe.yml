# 엔드포인트 검증 프로브 — 수동 실행 전용
# 랭킹/상세/리뷰 엔드포인트 응답을 점검하고 Playwright 로 리뷰 API 를 캡처한다.
name: probe

on:
  workflow_dispatch:
    inputs:
      goods_no:
        description: '검사할 goodsNo'
        required: false
        default: 'A000000247086'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Probe
        run: python -m scraper.probe --goods-no "${{ inputs.goods_no }}" --playwright

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out-${{ github.run_id }}
          path: probe_out
          retention-days: 7
          if-no-files-found: ignore
