# 전체 랭킹 TOP100 과거 리뷰 백필 — 수동 실행 전용 (1회성, 재개 가능)
# 6시간 한도 도달 전 스스로 체크포인트 저장 후 종료하고 자신을 재실행한다.
name: backfill

on:
  workflow_dispatch:
    inputs:
      max_products:
        description: '백필 대상 상품 수 (전체 랭킹 상위 N개)'
        required: false
        default: '100'

permissions:
  contents: write
  actions: write

concurrency:
  group: oliveyoung-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill
        run: |
          python -m scraper.backfill \
            --deadline-minutes 320 \
            --max-products "${{ inputs.max_products }}"

      - name: Commit & push data
        if: always()
        run: |
          mkdir -p data state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') backfill"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push failed — rebase and retry ($i/5)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done
          exit 1

      - name: Re-dispatch if incomplete
        if: hashFiles('.continuation_needed') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "backfill incomplete — dispatching continuation on ${GITHUB_REF_NAME}"
          gh workflow run backfill.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            -f max_products="${{ inputs.max_products }}"
