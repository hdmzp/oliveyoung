# 올리브영 일일 수집 — 매일 KST 10:00 (Actions 스케줄 특성상 수십 분 지연 가능)
# cron 은 기본 브랜치(main)에 이 파일이 있어야 동작한다.
name: collect

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 10:00 KST
  workflow_dispatch:
    inputs:
      max_products:
        description: '상품 수 제한 (스모크 테스트용, 비우면 전체)'
        required: false
        default: ''
      no_review_text:
        description: '리뷰 본문 수집 생략 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write   # 데드라인 중단 시 자기 자신 재실행

concurrency:
  group: oliveyoung-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        run: |
          ARGS="--deadline-minutes 320"
          if [ -n "${{ inputs.max_products }}" ]; then
            ARGS="$ARGS --max-products ${{ inputs.max_products }}"
          fi
          if [ "${{ inputs.no_review_text }}" = "true" ]; then
            ARGS="$ARGS --no-review-text"
          fi
          python -m scraper.main $ARGS

      - name: Commit & push data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') collect"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push failed — rebase and retry ($i/5)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done
          exit 1

      - name: Re-dispatch if incomplete
        if: hashFiles('.continuation_needed') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "run incomplete — dispatching continuation on ${GITHUB_REF_NAME}"
          gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-debug-${{ github.run_id }}
          path: |
            data
            state
          retention-days: 7
          if-no-files-found: ignore
